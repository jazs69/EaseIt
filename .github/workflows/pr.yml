# Fast PR checks: everything that can fail without a release being at stake.
#
# Two jobs, deliberately separate. `fast` needs no services and should finish in
# a couple of minutes; `integration` brings up PostgreSQL and is the one that
# actually exercises inventory and concurrency. A failure in either blocks.
#
# Nothing here runs against a shared database: the integration job creates
# `easeit_ci` inside an ephemeral service container that exists only for the
# duration of the run, and `scripts/require-services.mjs` refuses to proceed
# unless the live connection really is that database.

name: PR

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately. Local development is on Node 24.14.1 and pnpm 9.14.4;
  # `engines` permits Node >= 20.11.0, but CI pins one version so a failure is
  # never "works on my machine". Turbo 2.11.8 and TypeScript 6.0.3 come from the
  # lockfile, not from here.
  NODE_VERSION: '24.14.1'
  PNPM_VERSION: '9.14.4'

jobs:
  fast:
    name: fast (format, typecheck, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The format check compares this branch against its merge base, so it
          # needs more than a shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `cancel-retry.test.mjs` imports the compiled retry classifier, and
      # typecheck depends on a generated Prisma client, so the build comes
      # first. DATABASE_URL is required for the Prisma client to be
      # constructed; it is never connected to by this job.
      - name: Build
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: pnpm build

      # Both refs are passed, and the script decides which applies.
      #
      # `GATE_BASE_REF` is set only on a pull_request event; `GATE_BEFORE_REF`
      # only on a push. Supplying just the first is the defect this replaces:
      # on a push it expanded to the empty string, the script fell back to
      # comparing the working tree, a fresh checkout has nothing uncommitted,
      # and the format check passed having inspected zero files.
      #
      # `github.event.before` is the all-zero sha on the first push of a
      # branch; `scripts/lib/changed-files.mjs` treats that as "check every
      # tracked file" rather than as nothing to do, and fails outright if
      # neither ref is usable. See test/unit/gate-guards.test.mjs.
      - name: Fast gate
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GATE_BEFORE_REF: ${{ github.event.before }}
        run: pnpm gate

  integration:
    name: integration (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Matches local development: PostgreSQL 17.
        image: postgres:17
        env:
          POSTGRES_USER: easeit
          POSTGRES_PASSWORD: easeit_ci_local_only
          POSTGRES_DB: easeit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easeit -d easeit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suites read these files from disk rather than only the environment:
      # `mintSession` reads JWT_SECRET out of apps/api/.env, and the database
      # package resolves DATABASE_URL from packages/database/.env. Both are
      # gitignored, so CI has to write them.
      #
      # No repository secret is involved and none is needed: this database is
      # created empty, thrown away with the runner, and reachable only from
      # inside this job. The JWT secret is generated per run, so nothing
      # long-lived exists to leak. SMTP_HOST is deliberately left unset, which
      # selects the logging mailer instead of a real transport.
      - name: Write ephemeral env files
        run: |
          set -euo pipefail
          DB_URL="postgresql://easeit:easeit_ci_local_only@127.0.0.1:5432/easeit_ci?schema=public"
          printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DB_URL" "$DB_URL" > packages/database/.env
          {
            printf 'NODE_ENV=development\n'
            printf 'PORT=4100\n'
            printf 'DATABASE_URL=%s\n' "$DB_URL"
            printf 'DIRECT_URL=%s\n' "$DB_URL"
            printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'AUTH_COOKIE_NAME=easeit_session\n'
          } > apps/api/.env

      - name: Build
        run: pnpm build

      - name: Migrate and seed the ephemeral database
        run: |
          set -euo pipefail
          cd packages/database
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts

      # Backgrounded with its readiness waited on explicitly. `pnpm start` would
      # resolve the workspace script; calling node directly keeps the process
      # tree flat so the kill at the end is reliable.
      # `working-directory` is load-bearing, not tidiness.
      #
      # `apps/api/src/config/load-env.ts` resolves `.env` against
      # `process.cwd()`, and `ConfigModule`'s `envFilePath` is cwd-relative
      # too. Started from the repository root, the API looked for a root
      # `.env` that this workflow never writes -- it writes `apps/api/.env` --
      # so DATABASE_URL was absent, `@repo/database` threw at module scope and
      # the process exited before binding a port. The readiness loop then
      # spent 60 s on a process that was already dead, which is how run
      # 40820963243 failed at this step.
      #
      # Running from `apps/api` is also what `pnpm start` does, so CI and a
      # developer's machine now load env the same way.
      - name: Start the API against the ephemeral database
        working-directory: apps/api
        run: |
          set -euo pipefail
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4100/api/v1/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            # Fail fast if the process is already gone, instead of waiting out
            # the full minute for something that cannot recover.
            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
              echo "API process exited during startup; log follows:" >&2
              cat /tmp/api.log >&2
              exit 1
            fi
            sleep 1
          done
          echo "API did not become ready within 60s; last 50 log lines:" >&2
          tail -50 /tmp/api.log >&2
          exit 1

      # `EASEIT_TEST_DBS` extends the allowlist; it cannot authorise a
      # development database, which the suites refuse unconditionally.
      #
      # The output is mirrored into the job summary, and that is a deliberate
      # diagnostic, not decoration.
      #
      # Step logs need an authenticated token to download: `/actions/runs/{id}/logs`
      # and `/actions/jobs/{id}/logs` both answer 403 without one, and the
      # check-run annotations carry only "Process completed with exit code 1".
      # So when this step failed on run 41047772921 there was no way to learn
      # *which* suite failed without a GitHub login. The job summary is served
      # by the check-runs API, which public repositories expose unauthenticated,
      # so mirroring the gate output there makes a failure diagnosable by anyone
      # who can see the repository.
      #
      # `set +e` is the load-bearing part. GitHub runs `run:` blocks under
      # `bash -e`, so a non-zero `pnpm gate:integration` would abort the step
      # immediately and the summary would never be written -- the exact case the
      # summary exists for. Errexit is therefore disabled around the pipeline,
      # the gate's own status is taken from `PIPESTATUS[0]` (not `$?`, which
      # would be `tee`'s), errexit is restored, and the step exits with the
      # gate's code so a failure still fails the job.
      - name: Integration gate
        env:
          EASEIT_TEST_DBS: easeit_ci
          EASEIT_API_URL: http://127.0.0.1:4100/api/v1
        run: |
          set +e
          pnpm gate:integration 2>&1 | tee /tmp/gate-integration.log
          GATE_EXIT=${PIPESTATUS[0]}
          set -e

          {
            echo "## Integration gate"
            echo
            if [ "${GATE_EXIT}" -eq 0 ]; then
              echo "Result: **passed** (exit code \`0\`)"
            else
              echo "Result: **FAILED** (exit code \`${GATE_EXIT}\`)"
            fi
            echo
            echo "<details><summary>Full output of <code>pnpm gate:integration</code></summary>"
            echo
            echo '```text'
            # Bounded well under GitHub's 1 MiB per-step summary limit. A passing
            # run is about 66 KB, so this truncates only pathological output, and
            # it keeps the tail where the failure and the summary block live.
            tail -c 700000 /tmp/gate-integration.log 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${GATE_EXIT}"

      # Diagnostics only on failure, and only our own log — it contains no
      # credentials, and the generated JWT secret is never logged by the app.
      #
      # Mirrored into the job summary for the same reason as the gate above:
      # step logs need an authenticated token, so without this the API side of
      # a failure is unreadable to anyone without a GitHub login. Verified
      # against a real 282-line API log before wiring it up — no connection
      # string, token, JWT secret or password appears in it, and `SMTP_HOST` is
      # deliberately unset in this job, so the logging mailer is selected and no
      # mail credentials are constructed at all.
      #
      # Exit-code handling mirrors the gate step and is kept faithful to the
      # original `tail`: if `/tmp/api.log` is unreadable the step still fails,
      # as it did before. `PIPESTATUS[0]` is `tail`'s status, not `tee`'s.
      - name: API log (on failure)
        if: failure()
        run: |
          set +e
          tail -200 /tmp/api.log | tee /tmp/api-tail.log
          TAIL_EXIT=${PIPESTATUS[0]}
          set -e

          {
            echo "## API log (on failure)"
            echo
            if [ "${TAIL_EXIT}" -ne 0 ]; then
              echo "No API log was captured — \`/tmp/api.log\` was unreadable (tail exit \`${TAIL_EXIT}\`)."
            else
              echo "Last 200 lines of the API process log."
            fi
            echo
            echo "<details><summary>API log tail</summary>"
            echo
            echo '```text'
            # Decided from TAIL_EXIT and the file's size, not from `tail` failing
            # a second time. `tee` creates /tmp/api-tail.log even when the
            # upstream `tail` fails, so an earlier `|| echo ...` fallback here
            # never fired: the byte-cap `tail` simply succeeded on a zero-byte
            # file and the fence came out empty, which reads as "the API logged
            # nothing" rather than "there was no log to read".
            #
            # 200 lines is tens of KB in practice; the byte cap is a backstop so
            # a runaway log cannot push the job summary past GitHub's 1 MiB limit
            # and silently truncate the gate output written above it.
            if [ "${TAIL_EXIT}" -ne 0 ] || [ ! -s /tmp/api-tail.log ]; then
              echo "(no API output captured)"
            else
              tail -c 200000 /tmp/api-tail.log
            fi
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${TAIL_EXIT}"

      - name: Stop the API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then kill "$(cat /tmp/api.pid)" 2>/dev/null || true; fi
